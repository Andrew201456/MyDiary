<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#78334d">
  <meta name="description" content="Το προσωπικό σου ημερολόγιο κύκλου και ευεξίας">
  <title>MyDiary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body class="cloud-locked">
<section id="cloudLogin" class="cloud-login-screen" aria-label="Σύνδεση MyDiary">
  <div class="cloud-login-card">
    <div class="login-lockup"><img src="/icon.svg" alt="" width="46" height="46"><h1>MyDiary</h1></div>
    <h2 id="loginTitle">Σύνδεση</h2>
    <p>Το προσωπικό σου ημερολόγιο κύκλου.</p>
    <form id="cloudForm">
      <label for="cloudUsername">Όνομα χρήστη</label>
      <input id="cloudUsername" type="text" autocomplete="username" minlength="3" maxlength="31" pattern="[a-zA-Z][a-zA-Z0-9._\-]{2,30}" autocapitalize="none" spellcheck="false" required placeholder="π.χ. mydiary">
      <div id="cloudSignupWrap" hidden>
        <label for="cloudSignupCode">Κωδικός νέου λογαριασμού</label>
        <input id="cloudSignupCode" type="password" autocomplete="off" placeholder="Από τον διαχειριστή">
      </div>
      <label for="cloudPassword">Κωδικός πρόσβασης</label>
      <input id="cloudPassword" type="password" autocomplete="current-password" required placeholder="Ο προσωπικός σου κωδικός">
      <button id="cloudSubmit" type="submit">Σύνδεση</button>
    </form>
    <p id="cloudMessage" role="status" aria-live="polite"></p>
    <button id="cloudMode" type="button" class="login-switch" value="login">Δημιουργία λογαριασμού</button>
  </div>
</section>
<div id="cloudSyncBanner" class="cloud-sync-banner" role="status" aria-live="polite" hidden></div>
<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn hamburger" id="menuButton" aria-label="Μενού" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="page-heading"><span>MyDiary</span><h1 id="pageTitle">Σήμερα</h1></div>
    <button type="button" class="icon-btn top-action" id="topAction" aria-label="Μετάβαση στο σήμερα"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Κύρια πλοήγηση">
    <button data-nav="today" type="button"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg><span>Σήμερα</span></button>
    <button data-nav="calendar" type="button"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></svg><span>Ημερολόγιο</span></button>
    <button data-nav="add" type="button" class="nav-add" aria-label="Προσθήκη καταχώρησης"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-nav="food" type="button"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6a3 3 0 0 0 6 0V3M7 3v18M20 3c-3 0-5 4-5 8h5v10"/></svg><span>Τι τρώω</span></button>
    <button data-nav="reports" type="button"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16M8 15v-3m5 3V7m5 8v-5"/></svg><span>Αναφορές</span></button>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Μενού" aria-hidden="true">
    <div class="drawer-brand"><img src="/icon.svg" alt="" width="42" height="42"><div><strong>MyDiary</strong><small>Το προσωπικό σου ημερολόγιο</small></div></div>
    <button data-drawer="today">✿ Σήμερα</button>
    <button data-drawer="calendar">▦ Ημερολόγιο</button>
    <button data-drawer="reports">▥ Αναφορές</button>
    <button data-drawer="food">🍽 Τι τρώω</button>
    <button data-drawer="reminders">♧ Υπενθυμίσεις</button>
    <button data-drawer="settings">⚙ Ρυθμίσεις και αντίγραφα</button>
    <p class="drawer-note">Κρυπτογραφημένος συγχρονισμός μεταξύ συσκευών</p>
  </aside>
</div>
</body>
</html>
