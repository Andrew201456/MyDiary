<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff5e99">
  <meta name="description" content="Το προσωπικό σου ημερολόγιο κύκλου και ευεξίας">
  <title>MyDiary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body class="cloud-locked">
<section id="cloudLogin" class="cloud-login-screen" aria-label="Σύνδεση MyDiary">
  <div class="cloud-login-card">
    <img src="/icon-192.png" alt="" width="70" height="70">
    <div class="cloud-login-brand">MyDiary</div>
    <h2>Καλώς ήρθες 🌸</h2>
    <p>Το προσωπικό σου ημερολόγιο, ασφαλές στο Cloudflare.</p>
    <form id="cloudForm">
      <label for="cloudMode">Επιλογή</label>
      <select id="cloudMode" required><option value="login">Σύνδεση</option><option value="register">Νέος λογαριασμός</option></select>
      <label for="cloudUsername">Username</label>
      <input id="cloudUsername" type="text" autocomplete="username" minlength="3" maxlength="31" pattern="[a-zA-Z][a-zA-Z0-9._-]{2,30}" required placeholder="π.χ. mydiary">
      <label for="cloudPassword">Password</label>
      <input id="cloudPassword" type="password" autocomplete="current-password" required placeholder="Ο προσωπικός σου κωδικός">
      <button id="cloudSubmit" type="submit">Σύνδεση</button>
    </form>
    <p id="cloudMessage" role="status" aria-live="polite"></p>
    <small>Κρυπτογράφηση στη συσκευή · Τα στοιχεία σου δεν αποθηκεύονται αναγνώσιμα στη βάση.</small>
  </div>
</section>
<div id="cloudSyncBanner" class="cloud-sync-banner" role="status" aria-live="polite" hidden></div>
<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn hamburger" id="menuButton" aria-label="Μενού" aria-expanded="false"><span></span><span></span><span></span></button>
    <h1 id="pageTitle">Σήμερα</h1>
    <button type="button" class="icon-btn top-action" id="topAction" aria-label="Μετάβαση στο σήμερα"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Κύρια πλοήγηση">
    <button data-nav="today" type="button"><span class="nav-icon">✿</span><span>Σήμερα</span></button>
    <button data-nav="calendar" type="button"><span class="nav-icon">▦</span><span>Ημερολόγιο</span></button>
    <button data-nav="add" type="button" class="nav-add" aria-label="Προσθήκη καταχώρησης"><span>+</span></button>
    <button data-nav="reminders" type="button"><span class="nav-icon">♧</span><span>Υπενθυμίσεις</span></button>
    <button data-nav="reports" type="button"><span class="nav-icon">▥</span><span>Αναφορά</span></button>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Μενού" aria-hidden="true">
    <div class="drawer-brand"><img src="/icon.svg" alt="" width="42" height="42"><div><strong>MyDiary</strong><small>Το προσωπικό σου ημερολόγιο</small></div></div>
    <button data-drawer="today">✿ Σήμερα</button>
    <button data-drawer="calendar">▦ Ημερολόγιο</button>
    <button data-drawer="reports">▥ Αναφορές</button>
    <button data-drawer="reminders">♧ Υπενθυμίσεις</button>
    <button data-drawer="settings">⚙ Ρυθμίσεις και αντίγραφα</button>
    <p class="drawer-note">Ιδιωτικό • Χωρίς διαφημίσεις • Τα δεδομένα μένουν στη συσκευή</p>
  </aside>
</div>
</body>
</html>
